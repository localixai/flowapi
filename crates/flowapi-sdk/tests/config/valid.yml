# Every member of the format, each naming what the description has: no issue.
version: 1
generator: { flowapi: "0.2.x" }
spec: spec.json
package:
  name: "@petshop/sdk"
  client: PetShop
  license: MIT
  repository: https://github.com/petshop/sdk
  description: The TypeScript SDK of the Pet Shop API, unofficial.
  keywords: [pets, shop]
environments:
  production: https://api.petshop.example/v1
  sandbox: https://sandbox.petshop.example/v1
  default: production
  env_var: PET_SHOP_BASE_URL
auth:
  ApiKeyAuth: { env_var: PET_SHOP_API_KEY }
  bearer: { env_var: PET_SHOP_TOKEN }
  Session: { type: apiKey, in: cookie, name: sid, env_var: PET_SHOP_SESSION, description: A session }
  Admin: { type: http, scheme: basic, username_env_var: PET_SHOP_USER, password_env_var: PET_SHOP_PASSWORD }
  Client:
    type: oauth2
    token_url: https://login.petshop.example/token
    client_id_env_var: PET_SHOP_CLIENT_ID
    client_secret_env_var: PET_SHOP_CLIENT_SECRET
    scopes: [pets.read]
security:
  - ApiKeyAuth: []
  - bearer: []
defaults: { retries: 2, timeout: 60, max_retry_delay: 30, pagination: cursor }
pagination:
  cursor:
    type: cursor
    request: { cursor: page_token, limit: limit }
    response: { items: data, next: next_page_token, has_more: has_more }
  by_id:
    type: last_item_id
    request: { cursor: page_token }
    response: { items: data, id: id, has_more: has_more }
  photos:
    type: offset
    request: { offset: offset, limit: limit }
    response: { items: items, total: total }
  owners:
    type: link
    request: { limit: per_page }
    response: { header: Link }
  numbered:
    type: page
    request: { page: page, per_page: per_page }
    response: {}
    start: 1
  one:
    type: single
resources:
  pets:
    methods:
      list: listPets
      create: createPet
      get: { op: getPet, retries: 0 }
      update: "PATCH /pets/{pet_id}"
      delete: { op: "delete /pets/{pet_id}", security: [{ Admin: [] }, { Client: [pets.write], Session: [] }] }
    resources:
      photos:
        methods:
          list: { op: listPhotos, pagination: photos }
  owners:
    methods:
      list: { op: listOwners, pagination: owners }
  events:
    methods:
      stream: { op: streamEvents, stream: true }
  collisions:
    methods:
      get: { op: getCollision, security: [] }
  users:
    methods:
      list: { op: listUsers, pagination: one }
skip:
  - { op: "GET /internal/health", reason: not public }
readme: { title: Pet Shop SDK, headline_method: pets.list, pagination_method: pets.photos.list, intro: "The Pet Shop API." }
