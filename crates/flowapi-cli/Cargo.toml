[package]
name = "flowapi-cli"
description = "The flowapi command: types from an OpenAPI description or a JSON Schema, written to a file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "flowapi"
path = "src/main.rs"

[dependencies]
flowapi = { path = "../flowapi" }
flowapi-ts = { path = "../flowapi-ts" }
flowapi-rust = { path = "../flowapi-rust" }
# YAML read into the JSON the core reads, with each node's YAML place: the crate the
# WebAssembly module shares, so both read YAML alike.
flowapi-yaml = { path = "../flowapi-yaml" }
# The SDK layer, for the commands about an SDK's config: `summary`, `config draft|schema|check`.
flowapi-sdk = { path = "../flowapi-sdk" }

[lints]
workspace = true
