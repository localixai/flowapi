# A pet store, written the ways YAML descriptions are: block and flow style, quoted and plain
# response codes, a folded description, an anchor reused.
openapi: 3.1.0
info:
  title: Pet store
  version: "1.0"
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - &tags
          name: tags
          in: query
          style: form
          schema:
            type: array
            items: {type: string}
      responses:
        200:
          description: >
            The pets, in the order
            they were added.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Pet'}
        default: &error
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPet'}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        default: *error
  /pets/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    delete:
      operationId: deletePet
      responses:
        "204": {description: deleted}
        default: *error
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: {type: string, description: "The pet's name, \"as called\"."}
        tag: {type: [string, 'null']}
        status:
          enum: [available, pending, sold, ~]
        weight: {type: number, exclusiveMinimum: 0.0, default: 1.5e0}
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id: {type: integer, format: int64}
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code: {type: integer, format: int32}
        message:
          type: string
