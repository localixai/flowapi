# Stripe reads `Idempotency-Key`, so POSTs carry one and are retried with it. A GET of one object
# that the draft called `list` is `retrieve`, under the plural resource beside it (`accounts`,
# `balances`: a resource is not named as a schema). Resources and the other methods keep the
# draft's names.
