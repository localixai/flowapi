# GitHub's REST API (api.github.com) as a user would configure it, refined from `flowapi config
# draft openapi.json`. The description declares no security scheme, so the bearer token the API
# takes is declared here (docs.github.com, "Authenticating to the REST API") and made optional, as
# most public endpoints answer without one. Pagination is the draft's: `link` with `header: Link`
# where a response declares the header, `page` where it does not. Resources are the description's
# tags, as the draft has them; methods keep the draft's names.
version: 1
generator:
  flowapi: "0.3.0"
spec: openapi.json
package:
  name: github-rest-sdk
  client: GitHub
  license: MIT
  description: Unofficial TypeScript SDK for GitHub's REST API.
  keywords: [github, rest]
environments:
  production: "https://api.github.com"
  default: production
  env_var: GITHUB_BASE_URL
auth:
  Token:
    type: http
    scheme: bearer
    env_var: GITHUB_TOKEN
    description: A personal access token, a GitHub App's installation token, or GITHUB_TOKEN in Actions
security:
  - Token: []
  - {}
